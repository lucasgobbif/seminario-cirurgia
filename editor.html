<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor - Seminário de Cirurgia</title>
<link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
<style>
body { margin:0; font-family:Arial,sans-serif; }
#top { padding:12px; background:#202b38; color:white; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
button { padding:10px 14px; cursor:pointer; border:0; border-radius:5px; }
#editor { height:calc(100vh - 65px); }
#login { padding:30px; max-width:350px; margin:50px auto; }
#login input { display:block; width:100%; box-sizing:border-box; padding:12px; margin:12px 0; }
</style>
</head>
<body>

<div id="login">
<h2>Entrar no Editor</h2>
<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
<p id="msg"></p>
</div>

<div id="app" style="display:none">
<div id="top">
<strong>Editor do Seminário</strong>
<button onclick="device('Desktop')">PC</button>
<button onclick="device('Tablet')">Tablet</button>
<button onclick="device('Mobile')">Celular</button>
<button onclick="salvar()">Salvar alterações</button>
<button onclick="sair()">Sair</button>
</div>
<div id="editor"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/grapesjs"></script>

<script>
// COLE AQUI O PROJECT URL DO SUPABASE
const SUPABASE_URL = "https://mvmvhxrzbflgaplavmdo.supabase.co";

// COLE AQUI A PUBLISHABLE KEY DO SUPABASE
const SUPABASE_KEY = "sb_publishable_yR8nnZ8SfGcwr1Dx7LUpmw_hqbAmL9B";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let editor;

async function entrar() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  msg.textContent = "Entrando...";

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    msg.textContent = "Erro: " + error.message;
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  iniciarEditor();
}

async function iniciarEditor() {
  editor = grapesjs.init({
    container: "#editor",
    height: "100%",
    storageManager: false,
    selectorManager: { componentFirst: true },
   
  });

  editor.BlockManager.add("texto", {
    label: "Texto",
    content: "<p>Digite seu texto aqui</p>"
  });

  editor.BlockManager.add("imagem", {
    label: "Imagem",
    content: '<img src="https://placehold.co/600x300" style="width:100%">'
  });

  editor.BlockManager.add("secao", {
    label: "Seção",
    content: '<section style="padding:30px"><h2>Nova seção</h2><p>Edite este conteúdo</p></section>'
  });

  const { data } = await db
    .from("site_pages")
    .select("content")
    .eq("id", "principal")
    .maybeSingle();

  if (data && data.content && data.content.html) {
    editor.setComponents(data.content.html);
    editor.setStyle(data.content.css || "");
  } else {
    const resposta = await fetch("/index.html");
    const pagina = await resposta.text();
    const documento = new DOMParser().parseFromString(pagina, "text/html");

    editor.setComponents(documento.body.innerHTML);

    const estilos = [...documento.querySelectorAll("style")]
      .map(s => s.textContent)
      .join("\n");

    editor.setStyle(estilos);
  }
}

function device(tipo) {
  editor.setDevice(tipo);
}

async function salvar() {
  const { error } = await db.from("site_pages").upsert({
    id: "principal",
    content: {
      html: editor.getHtml(),
      css: editor.getCss()
    },
    updated_at: new Date().toISOString()
  });

  if (error) {
    alert("Erro ao salvar: " + error.message);
  } else {
    alert("Alterações salvas!");
  }
}

async function sair() {
  await db.auth.signOut();
  location.reload();
}
</script>
</body>
</html>
